<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Important for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO: Description and Keywords -->
    <meta name="description" content="Discover the Bible illustrated by Artificial Intelligence: read chapters and verses with unique AI-generated imagery.">
    <meta name="keywords" content="Bible, Artificial Intelligence, Old Testament, New Testament, AI-generated illustrations, biblical verses">

    <!-- Open Graph: improves appearance on social media -->
    <meta property="og:title" content="Bible Illustrated by AI">
    <meta property="og:description" content="Explore the Bible with AI-generated illustrations: read chapters and verses with unique interpretations by artificial intelligence.">
    <meta property="og:image" content="./imgs/featured-image.jpg"> <!-- Example featured image -->
    <meta property="og:url" content="https://yoursite.com"> <!-- Your actual site URL -->
    <meta property="og:type" content="website">

    <!-- Twitter Cards (optional) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bible Illustrated by AI">
    <meta name="twitter:description" content="Explore the Bible with AI-generated illustrations.">
    <meta name="twitter:image" content="./imgs/featured-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./imgs/favicon/biblia.png">

    <!-- Fonts and CSS -->
    <link rel="stylesheet" href="./fonts/fontsheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Bible Illustrated by AI – Read the Bible with AI-generated Illustrations</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <!-- Main heading of the site -->
        <h1 class="font-reader">
            Bible Illustrated by <span id="logo">Artificial Intelligence</span>
        </h1>

        <nav>
            <button class="chapter" onclick="HideOldTestament()">Old Testament</button>
            <ul id="old-testament" style="display: none;">
                <!-- Dynamically added book names go here -->
            </ul>
            <button class="chapter" onclick="HideNewTestament()">New Testament</button>
            <ul id="new-testament" style="display: none;">
                <!-- Dynamically added book names go here -->
            </ul>

            <div class="container" id="divChapters" style="display: none;">
                <p>Chapters of <span id="bookName">Book</span></p>
                <ul id="chapters"></ul>
            </div>

            <div class="container" id="divVerses" style="display: none;">
                <p><span id="bookNameChapter">Book - </span></p>
                <ul id="verses"></ul>
            </div>
            <br>
            <br>
            <div id="search">
                <input class="chapterSmall" placeholder="Search..." type="search" id="busca" value="">
            </div>
        </nav>
    </header>

    <main>
        <article>
            <!-- Dialog for illustrations -->
            <dialog id="DialogMain">
                <fieldset>
                    <figure>
                        <!-- Be sure to include alt text for accessibility and SEO -->
                        <img class="ilustrated" id="imgSelected" src="./imgs/1_1_2.jpg" 
                             alt="AI-generated biblical illustration">
                    </figure>
                    <p class="font-reader ilustrated" id="legenda"></p>
                </fieldset>
                <div class="dialogBtns">
                    <button class="chapterSpecial" onclick="closeDialog()">Back</button>
                </div>
            </dialog>

            <!-- Headings for content organization -->
            <h2 class="font-reader" id="book">Book</h2>
            <h3 class="font-reader" id="chapter"></h3>

            <div id="loader" class="loader"></div>
        </article>
    </main>

    <div class="btns">
        <button onclick="PreviousChapter()" class="chapter">Previous Chapter</button>
        <button onclick="NextChapter()" class="chapter">Next Chapter</button>
    </div>

    <footer>
        <button onclick="darkMode()" class="chapterSmall">
            <i id="darkMode" class="fa fa-toggle-on" style="font-size:2rem;"></i>
        </button>
        <br>
        <label for="darkMode" id="lblDarkMode">Activate Light Mode</label>
        <br>
        <label for="version">Choose a Bible translation:</label>
        <select class="chapter" onchange="bibleTranslation()" name="version" id="version">
            <option value="bbe">Bible In Basic English - BBE</option>
            <option value="kjv">King James Version - KJV</option>
        </select>

        <p id="Created">Created by Lennon Sales Furtado – Bible Illustrated by AI – All rights reserved</p>
        <script>
            const date = new Date(); 
            document.getElementById("Created").innerText += " – " + date.getFullYear();
        </script>
        <a href="./privacidade.html">Privacy Policy</a>
    </footer>

    <!-- Load scripts at the end to improve page performance -->
    <script src="./jsons/en/kjv.js"></script>
    <script src="./jsons/en/bbe.js"></script>
    <script src="./index.js"></script>
</body>
</html>
