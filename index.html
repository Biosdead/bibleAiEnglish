    <!-- Scripts placed at the end to improve performance -->

    <script>
    let lastScrollTop = 0;
    const buttonBar = document.getElementById("buttonBar");
    const topBar = document.getElementById("mainHeader");

    window.addEventListener("scroll", function() {
      let currentScroll = window.pageYOffset || document.documentElement.scrollTop;

      if (currentScroll > lastScrollTop) {
        // Scrolling down -> hide bars
        buttonBar.classList.add("hidden");
        topBar.classList.add("hidden");
      } else {
        // Scrolling up -> show bars
        buttonBar.classList.remove("hidden");
        topBar.classList.remove("hidden");
      }

      lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; // avoids negative values
    });

    const mainContent = document.querySelector("main");
    if (mainContent) {
      mainContent.addEventListener("click", function() {
        const isHidden = buttonBar.classList.contains("hidden") && topBar.classList.contains("hidden");
        if (isHidden) {
          buttonBar.classList.remove("hidden");
          topBar.classList.remove("hidden");
        } else {
          buttonBar.classList.add("hidden");
          topBar.classList.add("hidden");
        }
      });
    }
    </script>
